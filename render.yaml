services:
  - type: web
    name: voicepad-transcription
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TRANSLATION_MODEL
        value: whisper-large-v3
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: MAX_REQUESTS_PER_MINUTE
        value: "10"
      - key: MAX_REQUESTS_PER_USER_PER_MINUTE
        value: "20"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: REQUIRE_AUTH
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEY_BACKUP
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY_1
        sync: false
      - key: DEEPGRAM_API_KEY_2
        sync: false
      - key: DEEPGRAM_API_KEY_3
        sync: false
      - key: DEEPGRAM_API_KEYS
        sync: false
