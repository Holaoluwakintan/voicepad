services:
  - type: web
    name: voicepad-transcription
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TRANSLATION_MODEL
        value: whisper-large-v3
      - key: MAX_REQUESTS_PER_MINUTE
        value: "60"
      - key: MAX_REQUESTS_PER_USER_PER_MINUTE
        value: "120"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        value: "https://vfwdrpvfcvwsrhxuabak.supabase.co"
      - key: SUPABASE_ANON_KEY
        value: "sb_publishable_c7Dqa3N6mHOmrN64oPDkHw_saVtTEFK"
      - key: REQUIRE_AUTH
        value: "true"
      - key: MOBILE_GUEST_DAILY_LIMIT
        value: "3"

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEY_BACKUP
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY_1
        sync: false
      - key: DEEPGRAM_API_KEY_2
        sync: false
      - key: DEEPGRAM_API_KEY_3
        sync: false
      - key: DEEPGRAM_API_KEYS
        sync: false
      - key: APK_DOWNLOAD_URL
        sync: false
      - key: WEB_GUEST_DAILY_LIMIT
        value: "10"
