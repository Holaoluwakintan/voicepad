<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>VoicePad — voice notes that think with you</title>
    <meta name="description" content="VoicePad turns the things you say out loud into clear, useful notes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Optional analytics (Umami). Only loads if both env vars are actually set on Vercel;
      previously this always shipped a broken <script src="%VITE_ANALYTICS_ENDPOINT%/umami">
      tag whenever the vars were unset, since Vite leaves unresolved %VAR% placeholders
      as literal text instead of removing the tag.
    -->
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        var isUnset = function (v) { return !v || v.indexOf("%VITE_") === 0; };
        if (isUnset(endpoint) || isUnset(websiteId)) return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint + "/umami";
        s.setAttribute("data-website-id", websiteId);
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
